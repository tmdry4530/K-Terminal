<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>K Terminal Finance</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="topbar">
      <div class="brand">K TERMINAL</div>
      <nav class="global-menu" aria-label="전역 메뉴">
        <button data-global="market">Markets</button>
        <button data-global="signals">Signals</button>
        <button data-global="chart">Chart</button>
        <button data-global="order">주문</button>
      </nav>
      <div class="command-box">
        <span>&lt;GO&gt;</span>
        <input id="command-input" type="text" list="command-list" placeholder="코인 심볼 입력 (/ 포커스, ? 도움말): BTC-USD / ETH-USD / SOL-USD" autocomplete="off" aria-label="심볼 입력" />
        <datalist id="command-list"></datalist>
      </div>
      <button id="login-open" class="login-button">LOGIN</button>
      <div class="clock-wrap">
        <span class="stream-badge" id="stream-state" title="실시간 스트림 상태">OFF</span>
        <span class="clock" id="clock">--:--:--</span>
      </div>
    </header>

    <section class="index-strip" id="index-strip" aria-label="지수 스트립" aria-live="polite"></section>

    <section class="subtabs" id="subtabs" aria-label="내부 탭">
      <button data-tab="market" class="active">시장</button>
      <button data-tab="signals">시그널</button>
      <button data-tab="chart">차트</button>
      <button data-tab="order">주문</button>
    </section>

    <main id="workspace" class="workspace">
      <section class="panel left-panel" data-panel="left"></section>
      <div class="splitter" data-splitter="left" role="separator" aria-label="좌측 패널 폭 조절"></div>
      <section class="panel center-panel" data-panel="center"></section>
      <div class="splitter" data-splitter="right" role="separator" aria-label="우측 패널 폭 조절"></div>
      <section class="panel right-panel" data-panel="right"></section>
    </main>

    <footer class="statusbar">
      <div>데이터 정책: 실제 데이터 / 지연 데이터 / API 필요 / 데이터 없음 명확 표시</div>
      <div id="connection-state">연결 확인 중</div>
      <div id="active-symbol-status">BTC-USD</div>
    </footer>
  </div>

  <dialog id="login-dialog" class="modal">
    <form method="dialog" class="modal-card" id="auth-form">
      <header>
        <strong>로그인 / 가입</strong>
        <button value="cancel" class="icon-button">×</button>
      </header>
      <label>이메일 <input id="auth-email" type="email" required placeholder="you@example.com" /></label>
      <label>비밀번호 <input id="auth-password" type="password" required minlength="10" placeholder="10자 이상" /></label>
      <div class="row gap">
        <button id="login-submit" type="button">로그인</button>
        <button id="register-submit" type="button">가입</button>
        <button id="logout-submit" type="button">로그아웃</button>
      </div>
      <p id="auth-message" class="muted"></p>
    </form>
  </dialog>

  <dialog id="big-modal" class="modal big-modal">
    <form method="dialog" class="modal-card wide">
      <header>
        <strong id="big-modal-title">크게 보기</strong>
        <button value="cancel" class="icon-button">×</button>
      </header>
      <div id="big-modal-content"></div>
    </form>
  </dialog>

  <dialog id="help-dialog" class="modal">
    <form method="dialog" class="modal-card">
      <header><strong>키보드 단축키</strong><button value="cancel" class="icon-button" aria-label="닫기">×</button></header>
      <table class="table"><tbody>
        <tr><td class="left"><kbd>/</kbd></td><td class="left">명령창 포커스</td></tr>
        <tr><td class="left"><kbd>1</kbd>–<kbd>4</kbd></td><td class="left">탭 전환 (시장·시그널·차트·주문)</td></tr>
        <tr><td class="left"><kbd>r</kbd></td><td class="left">현재 화면 데이터 새로고침</td></tr>
        <tr><td class="left"><kbd>?</kbd></td><td class="left">이 도움말 열기/닫기</td></tr>
        <tr><td class="left"><kbd>Esc</kbd></td><td class="left">닫기</td></tr>
      </tbody></table>
      <div class="muted">명령창: 코인 심볼 입력 → 차트(예: <code>BTC-USD</code>, <code>ETH-USD</code>). 빈 입력에서 <kbd>↑</kbd>로 최근 명령 호출, 입력 중 자동완성 제공.</div>
    </form>
  </dialog>

  <template id="widget-template">
    <article class="widget" draggable="true">
      <header class="widget-header">
        <div>
          <strong class="widget-title"></strong>
          <span class="widget-subtitle"></span>
        </div>
        <div class="widget-actions"></div>
      </header>
      <div class="widget-body"></div>
    </article>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
