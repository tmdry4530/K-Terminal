name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']
    name: verify (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — this is a pure Node.js project.
      - name: Syntax check
        run: node --check src/server.js && node --check public/app.js
      - name: Unit tests
        run: npm test
      - name: Smoke test
        run: npm run smoke
